<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Volcanic Ash Analysis{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,body{height:100%;margin:0}
        body{min-height:100vh}
        .app{min-height:100vh}
        .app-body{height:calc(100vh - 56px - 49px)}
        .sidebar-wrapper{height:100%;overflow:hidden}
        .main-content{height:100%;overflow-y:auto}
    </style>
</head>
<body class="bg-light">
    <div class="app d-flex flex-column">
        {% include "layouts/navbar.html" %}

        <div class="app-body container-fluid flex-grow-1">
            <div class="row h-100">
                {% include "layouts/sidebar.html" %}

                <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 main-content">
                    {% block content %}{% endblock %}
                </main>
            </div>
        </div>

        {% include "layouts/footer.html" %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

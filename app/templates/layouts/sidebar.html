<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    .sidebar-wrapper .nav-link {
        color: #495057;
        border-radius: 6px;
        margin: 2px 10px;
        padding: 10px 12px;
        transition: all 0.2s ease;
    }

    .sidebar-wrapper .nav-link:hover {
        color: #0d6efd;
        background-color: #f0f4ff;
    }

    .sidebar-wrapper .nav-link.active {
        color: #0d6efd;
        background-color: #e7f1ff;
        font-weight: 600;
    }
</style>
{% set path = request.url.path %}

<div class="col-md-3 col-lg-2 d-md-block bg-white sidebar-wrapper border-end">
  <div class="position-sticky pt-3">

    <div class="px-3 mb-2 small text-uppercase text-muted fw-semibold">Utama</div>
    <ul class="nav flex-column mb-3">
      <li class="nav-item">
        <a class="nav-link {% if path == '/dashboard' %}active{% endif %}"
           href="/dashboard"
           {% if path == '/dashboard' %}aria-current="page"{% endif %}>
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
    </ul>

    <div class="px-3 mb-2 small text-uppercase text-muted fw-semibold">Alur Simulasi</div>
    <ul class="nav flex-column mb-3">

      <li class="nav-item">
        <a class="nav-link {% if path.startswith('/meteorology') or path.startswith('/simulations/meteorology') %}active{% endif %}"
           href="/meteorology/config"
           {% if path.startswith('/meteorology') or path.startswith('/simulations/meteorology') %}aria-current="page"{% endif %}>
          <i class="bi bi-cloud-sun me-2"></i> Konfigurasi Meteorologi
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if path.startswith('/source-config') or path.startswith('/simulations/source') %}active{% endif %}"
           href="/source-config"
           {% if path.startswith('/source-config') or path.startswith('/simulations/source') %}aria-current="page"{% endif %}>
          <i class="bi bi-fire me-2"></i> Konfigurasi Sumber
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if path.startswith('/dispersion') or path.startswith('/simulations/create') %}active{% endif %}"
           href="/dispersion"
           {% if path.startswith('/dispersion') or path.startswith('/simulations/create') %}aria-current="page"{% endif %}>
          <i class="bi bi-wind me-2"></i> Model Dispersi
        </a>
      </li>

    </ul>

    <div class="px-3 mb-2 small text-uppercase text-muted fw-semibold">Arsip</div>
    <ul class="nav flex-column">

      <li class="nav-item">
        <a class="nav-link {% if path.startswith('/simulations/history') or path.startswith('/simulations/detail') %}active{% endif %}"
           href="/simulations/history"
           {% if path.startswith('/simulations/history') or path.startswith('/simulations/detail') %}aria-current="page"{% endif %}>
          <i class="bi bi-clock-history me-2"></i> Riwayat
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if path.startswith('/reports') %}active{% endif %}"
           href="/reports"
           {% if path.startswith('/reports') %}aria-current="page"{% endif %}>
          <i class="bi bi-file-earmark-bar-graph me-2"></i> Laporan
        </a>
      </li>

    </ul>
  </div>
</div>
